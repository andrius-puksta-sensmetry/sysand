name: Publish to TestPyPI

on:
  push:
    branches: [ "ap/refactor-ci" ]
    tags: ["*"]
  pull_request:
    branches: [ "ap/refactor-ci" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
    steps:
      - uses: actions/checkout@v6
      # - uses: actions/setup-python@v6
      #   with:
      #     python-version: 3.14
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release -o dist -m bindings/py/Cargo.toml -F vendored_tls
          # working-directory: bindings/py
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          rust-toolchain: 1.85
          manylinux: auto
          before-script-linux: |
            /bin/bash .github/scripts/install-linux-dependencies.sh
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.13t -m bindings/py/Cargo.toml --features vendored_tls
          # working-directory: bindings/py
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          rust-toolchain: 1.85
          manylinux: auto
          before-script-linux: |
            /bin/bash .github/scripts/install-linux-dependencies.sh
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/py
      - name: Upload sdist
        uses: actions/upload-artifact@v5
        with:
          name: wheels-sdist
          path: bindings/py/dist

  release:
    name: Release to testpypi
    environment: testpypi
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive -r testpypi --skip-existing wheels-*/*
          working-directory: bindings/py
